[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgext.pluggable"
version = "0.9.0"
description = "Plug applications and extensions in a TurboGears2 project"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
keywords = ["turbogears2.extension"]
license = { text = "MIT" }
authors = [
    { name = "Alessandro Molina", email = "alessandro.molina@axant.it" },
    { name = "Jaroslav Mikulík", email = "byczech@gmail.com" }
]
urls = { Homepage = "https://github.com/TurboGears/tgext.pluggable" }
classifiers = [
    "Environment :: Web Environment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: TurboGears",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
dependencies = [
    "TurboGears2 >= 2.5.0",
    "gearbox",
]

[project.entry-points."gearbox.commands"]
quickstart-pluggable = "tgext.pluggable.commands.quickstart:QuickstartPluggableCommand"
sqla-migrate-pluggable = "tgext.pluggable.commands.migration:MigrateCommand"
migrate-pluggable = "tgext.pluggable.commands.alembic_migration:MigrateCommand"
plug = "tgext.pluggable.commands.plug:PlugApplicationCommand"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
exclude = [
    "tgext.pluggable.commands.quickstart.template*",
    "tgext.pluggable.commands.alembic_migration.template*",
]
